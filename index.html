<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/teacher-ai-web/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Elevo - منصة إدارة الإنجاز المهني للمعلمات">
  <meta name="theme-color" content="#4F46E5">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Elevo">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Elevo</title>
  <link rel="manifest" href="manifest.json">

</head>
<body>
  <script>
    // إصلاح ذاتي: بعض المتصفحات التي زارت الموقع سابقاً قد يكون لديها
    // Service Worker مسجَّل من نسخة قديمة، يعرض نسخة قديمة من البرنامج
    // حتى بعد نشر تحديث جديد (المستخدم لا يرى أثر أي إصلاح إلا بفتح
    // نافذة متصفح خفية). نزيله فوراً عند كل تحميل صفحة حتى لا تتكرر
    // هذه المشكلة مستقبلاً، بلا أي خطوة يدوية من المستخدم.
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function (registrations) {
        for (const registration of registrations) {
          registration.unregister();
        }
      });
    }
    if (window.caches) {
      caches.keys().then(function (names) {
        for (const name of names) {
          caches.delete(name);
        }
      });
    }
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
